name: Build patched Umami image

on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build-and-push.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

env:
  UMAMI_VERSION: '3.5.0'
  NODE_VERSION: '22.23.5'

concurrency:
  group: patched-umami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for runtime tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: umami:ci-${{ matrix.suffix }}
          build-args: |
            UMAMI_VERSION=${{ env.UMAMI_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Verify Node.js, runtime UID and architecture
        shell: bash
        env:
          TEST_IMAGE: umami:ci-${{ matrix.suffix }}
          EXPECTED_ARCH: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          node_version="$(docker run --rm --entrypoint node "$TEST_IMAGE" --version)"
          runtime_uid="$(docker run --rm --entrypoint id "$TEST_IMAGE" -u)"
          actual_arch="$(docker image inspect "$TEST_IMAGE" --format '{{.Architecture}}')"

          test "$node_version" = "v${NODE_VERSION}"
          test "$runtime_uid" = '1001'
          test "$actual_arch" = "$EXPECTED_ARCH"

          printf 'Verified %s: Node.js %s, UID %s, architecture %s\n' \
            "$TEST_IMAGE" "$node_version" "$runtime_uid" "$actual_arch"

  publish:
    name: Publish multi-arch image to GHCR
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Determine GHCR image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/umami" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ env.UMAMI_VERSION }}-node${{ env.NODE_VERSION }}
            type=sha,prefix=${{ env.UMAMI_VERSION }}-node${{ env.NODE_VERSION }}-sha-

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            UMAMI_VERSION=${{ env.UMAMI_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min

      - name: Publish digest in job summary
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Umami image'
            echo
            echo "- Image: \`${IMAGE_NAME}:${UMAMI_VERSION}-node${NODE_VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pull by digest: \`${IMAGE_NAME}@${DIGEST}\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
          } >> "$GITHUB_STEP_SUMMARY"
