name: Build patched Umami image

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.sqlite
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Dockerfile.sqlite
  workflow_dispatch:

permissions:
  contents: read

env:
  UMAMI_VERSION: '3.5.0'
  NODE_VERSION: '22.23.5'
  SQLITE_BASE: 'ghcr.io/maxime-j/umami-sqlite:latest'

concurrency:
  group: patched-umami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for runtime tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: umami:ci-${{ matrix.suffix }}
          build-args: |
            UMAMI_VERSION=${{ env.UMAMI_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Verify Node.js, runtime UID and architecture
        shell: bash
        env:
          TEST_IMAGE: umami:ci-${{ matrix.suffix }}
          EXPECTED_ARCH: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          node_version="$(docker run --rm --entrypoint node "$TEST_IMAGE" --version)"
          runtime_uid="$(docker run --rm --entrypoint id "$TEST_IMAGE" -u)"
          actual_arch="$(docker image inspect "$TEST_IMAGE" --format '{{.Architecture}}')"

          test "$node_version" = "v${NODE_VERSION}"
          test "$runtime_uid" = '1001'
          test "$actual_arch" = "$EXPECTED_ARCH"

          printf 'Verified %s: Node.js %s, UID %s, architecture %s\n' \
            "$TEST_IMAGE" "$node_version" "$runtime_uid" "$actual_arch"

  publish:
    name: Publish multi-arch image to GHCR
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Determine GHCR image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/umami" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ env.UMAMI_VERSION }}-node${{ env.NODE_VERSION }}
            type=sha,prefix=${{ env.UMAMI_VERSION }}-node${{ env.NODE_VERSION }}-sha-

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            UMAMI_VERSION=${{ env.UMAMI_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min

      - name: Publish digest in job summary
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Umami image'
            echo
            echo "- Image: \`${IMAGE_NAME}:${UMAMI_VERSION}-node${NODE_VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pull by digest: \`${IMAGE_NAME}@${DIGEST}\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
          } >> "$GITHUB_STEP_SUMMARY"

  inspect-sqlite-upstream:
    name: Inspect SQLite fork runtime
    runs-on: ubuntu-latest
    outputs:
      node_flavor: ${{ steps.inspect.outputs.node_flavor }}
      upstream_uid: ${{ steps.inspect.outputs.upstream_uid }}
      patched_version: ${{ steps.inspect.outputs.patched_version }}
      source_ref: ${{ steps.inspect.outputs.source_ref }}
    steps:
      - name: Check upstream OS, Node major and UID
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SQLITE_BASE"
          source_ref="$(docker image inspect "$SQLITE_BASE" --format '{{index .RepoDigests 0}}')"
          test -n "$source_ref"
          os_id="$(docker run --rm --entrypoint sh "$SQLITE_BASE" -c '. /etc/os-release; printf "%s" "$ID"')"
          case "$os_id" in
            alpine) node_flavor=alpine ;;
            debian|ubuntu) node_flavor=bookworm-slim ;;
            *) echo "Unsupported SQLite upstream base OS: $os_id" >&2; exit 1 ;;
          esac
          upstream_node="$(docker run --rm --entrypoint node "$SQLITE_BASE" --version)"
          case "$upstream_node" in
            v22.*) patched_version=22.23.5 ;;
            v24.*) patched_version=24.22.3 ;;
            v26.*) patched_version=26.13.1 ;;
            *) echo "SQLite upstream uses unsupported Node.js version: $upstream_node" >&2; exit 1 ;;
          esac
          upstream_uid="$(docker run --rm --entrypoint id "$SQLITE_BASE" -u)"
          echo "node_flavor=$node_flavor" >> "$GITHUB_OUTPUT"
          echo "upstream_uid=$upstream_uid" >> "$GITHUB_OUTPUT"
          echo "patched_version=$patched_version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          printf 'SQLite base: %s, Node.js %s, OS %s, UID %s\n' \
            "$SQLITE_BASE" "$upstream_node" "$os_id" "$upstream_uid"

  verify-sqlite:
    name: Verify SQLite ${{ matrix.platform }}
    needs: inspect-sqlite-upstream
    runs-on: ubuntu-latest
    env:
      SQLITE_NODE_VERSION: ${{ needs.inspect-sqlite-upstream.outputs.patched_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build SQLite image for runtime tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.sqlite
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          pull: true
          tags: umami-sqlite:ci-${{ matrix.suffix }}
          build-args: |
            SQLITE_BASE=${{ needs.inspect-sqlite-upstream.outputs.source_ref }}
            SQLITE_NODE_VERSION=${{ env.SQLITE_NODE_VERSION }}
            NODE_FLAVOR=${{ needs.inspect-sqlite-upstream.outputs.node_flavor }}

      - name: Verify Node, UID, architecture and SQLite functionality
        shell: bash
        env:
          TEST_IMAGE: umami-sqlite:ci-${{ matrix.suffix }}
          EXPECTED_ARCH: ${{ matrix.suffix }}
          EXPECTED_UID: ${{ needs.inspect-sqlite-upstream.outputs.upstream_uid }}
        run: |
          set -euo pipefail
          node_version="$(docker run --rm --entrypoint node "$TEST_IMAGE" --version)"
          runtime_uid="$(docker run --rm --entrypoint id "$TEST_IMAGE" -u)"
          actual_arch="$(docker image inspect "$TEST_IMAGE" --format '{{.Architecture}}')"
          test "$node_version" = "v${SQLITE_NODE_VERSION}"
          test "$runtime_uid" = "$EXPECTED_UID"
          test "$actual_arch" = "$EXPECTED_ARCH"
          printf 'Verified %s: Node.js %s, UID %s, arch %s\n' \
            "$TEST_IMAGE" "$node_version" "$runtime_uid" "$actual_arch"

      - name: Smoke-test startup with file-backed SQLite
        shell: bash
        env:
          TEST_IMAGE: umami-sqlite:ci-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          container="umami-sqlite-ci-${{ matrix.suffix }}"
          trap 'docker logs "$container" 2>/dev/null || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" \
            -e 'DATABASE_URL=file:/db/umami.db' \
            -e 'APP_SECRET=ci-smoke-secret-change-in-production' \
            --tmpfs '/db:rw,size=128m,mode=1777' \
            -p 127.0.0.1::3000 \
            "$TEST_IMAGE"
          hostport="$(docker port "$container" 3000/tcp | sed -n '1s/.*://p')"
          test -n "$hostport"
          passed=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then
              echo 'SQLite container exited during startup' >&2
              exit 1
            fi
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "http://127.0.0.1:${hostport}/login" || true)"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]] \
                && docker exec "$container" sh -c 'test -s /db/umami.db'; then
              passed=1
              break
            fi
            sleep 2
          done
          test "$passed" -eq 1 || { echo 'SQLite HTTP/database startup smoke test failed' >&2; exit 1; }

  publish-sqlite:
    name: Publish multi-arch SQLite variant to GHCR
    needs: [inspect-sqlite-upstream, verify-sqlite]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SQLITE_NODE_VERSION: ${{ needs.inspect-sqlite-upstream.outputs.patched_version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Determine image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/umami-sqlite" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=node${{ env.SQLITE_NODE_VERSION }}
            type=sha,prefix=node${{ env.SQLITE_NODE_VERSION }}-sha-
      - name: Build and publish SQLite image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.sqlite
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            SQLITE_BASE=${{ needs.inspect-sqlite-upstream.outputs.source_ref }}
            SQLITE_NODE_VERSION=${{ env.SQLITE_NODE_VERSION }}
            NODE_FLAVOR=${{ needs.inspect-sqlite-upstream.outputs.node_flavor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min
      - name: Record published digest
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published patched SQLite fork'
            echo
            echo "- Image: \`${IMAGE_NAME}:node${SQLITE_NODE_VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo '- Source: `ghcr.io/maxime-j/umami-sqlite:latest` (Umami SQLite fork, not upstream 3.5.0)'
          } >> "$GITHUB_STEP_SUMMARY"
